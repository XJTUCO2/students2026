const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

[...new Set(students.map(s=>s.start).filter(Boolean))].sort().reverse().forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+' 年进组';$('#year').append(o)});
const teacherProfiles={"宋昱龙":"https://gr.xjtu.edu.cn/en/web/yulong.song","殷翔":"https://gr.xjtu.edu.cn/en/web/xiangyin","王文毅":"https://gr.xjtu.edu.cn/en/web/wenyii.wang","宗硕":"https://gr.xjtu.edu.cn/en/web/szong","崔策":"https://gr.xjtu.edu.cn/en/web/cui_xjtu","杨旭":"https://gr.xjtu.edu.cn/web/yangzx"};
function teacherName(name){const text=String(name||'').trim();return Object.hasOwn(teacherProfiles,text)?'<a class="teacher-profile" href="'+esc(teacherProfiles[text])+'" target="_blank" rel="noopener noreferrer" title="'+esc(text)+'的教师个人主页">'+esc(text)+'</a>':esc(text)}
const mentorOrder=['曹锋','殷翔','宋昱龙','杨旭','王文毅','崔策'];
function mentorRank(name){const i=mentorOrder.indexOf(String(name||'').trim());return i<0?mentorOrder.length:i}
function degreeLabel(s){if(s.degree)return s.degree;if(s.name==='杨喆')return '博士研究生';const end=Number(s.expected)||(s.end&&s.end!=='其他'?Number(s.end):0);const start=Number(s.start);return !start||!end?'学位待确认':end-start===3?'硕士研究生':'博士研究生'}
function hasGraduated(s){return s.status==='graduated'||(!!s.end&&s.end!=='其他')}
const nameCollator=new Intl.Collator('zh-CN-u-co-pinyin');
function degreeRank(s){return degreeLabel(s)==='博士研究生'?0:degreeLabel(s)==='硕士研究生'?1:2}
function compareStudents(a,b){return Number(b.start)-Number(a.start)||Number(!!a.partTime)-Number(!!b.partTime)||Number(hasGraduated(a))-Number(hasGraduated(b))||degreeRank(a)-degreeRank(b)||mentorRank(a.mentor)-mentorRank(b.mentor)||nameCollator.compare(a.name,b.name)}
function render(){const q=$('#search').value.trim().toLowerCase();const list=students.filter(s=>(!q||[s.name,s.city,s.unit,s.mentor,degreeLabel(s),s.partTime?'在职博士':''].join(' ').toLowerCase().includes(q))&&(!$('#year').value||s.start==$('#year').value)&&(!$('#status').value||($('#status').value==='alumni'?hasGraduated(s):!hasGraduated(s)))).sort(compareStudents);window.updateCityMap(list);$('#count').textContent='成员名录 / 共 '+students.length+' 位，当前显示 '+list.length+' 位';$('#grid').innerHTML=list.map((s,i)=>`${i===0||s.start!==list[i-1].start?`<div class="year-heading"><h2>${s.start?esc(s.start)+'年':'进组年份待确认'}</h2><span>${list.filter(p=>p.start===s.start).length} 位成员</span></div>`:""}<article><div class="portrait ${s.photoRotation===90?'rotated-portrait':''}"><img data-rotation="${s.photoRotation||0}" loading="lazy" src="${esc(s.photo)}" alt="${esc(s.name)}的照片"></div><div class="body"><div class="member-title"><h2>${teacherName(s.name)}</h2><span class="degree-label ${s.partTime?'part-time':''}">${s.partTime?'在职博士':degreeLabel(s)}</span><span class="status-tag ${hasGraduated(s)?'graduated':'studying'}">${hasGraduated(s)?'已毕业':s.status==='unknown'?'状态待确认':'在组'}</span></div><div class="mentor">导师 · ${teacherName(s.mentor||'未填写')}</div><div class="period">${hasGraduated(s)&&s.end&&s.end!=='其他'?esc(s.start||'未填写')+'—'+esc(s.end):s.start?esc(s.start)+' 年进组':'进组年份待确认'}</div><div class="city">◎ ${esc(s.city||'城市未填写')}</div><div class="unit">${esc(s.unit||'单位未填写')}</div>${s.message?`<details><summary>来自 TA 的寄语</summary>${esc(s.message)}</details>`:''}</div></article>`).join('')||'<div class="empty">没有找到匹配的成员，请调整搜索条件。</div>';document.querySelectorAll('article img').forEach(img=>img.onclick=()=>{$('#photo').classList.toggle('rotated-dialog',img.dataset.rotation==='90');$('#large').src=img.src;$('#large').alt=img.alt;$('#photo').showModal()})}['search','year','status'].forEach(id=>$('#'+id).addEventListener('input',render));$('#reset').onclick=()=>{['search','year','status'].forEach(id=>$('#'+id).value='');render()};$('#close').onclick=()=>$('#photo').close();render();
</script><script src="feedback-helper.js?v=24"></script><script src="navigation.js"></script><script src="map-messages.js"></script></body></html>
